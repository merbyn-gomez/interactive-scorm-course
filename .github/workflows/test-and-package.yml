name: Validate & build SCORM package
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate course
        run: python tests/validate.py
      - name: Simulated LMS end-to-end test
        run: node tests/smoke.js
      - name: Build importable SCORM ZIP
        run: |
          mkdir -p dist
          zip -j -9 dist/curso-indicadores-SCORM12.zip index.html imsmanifest.xml
          unzip -l dist/curso-indicadores-SCORM12.zip
      - uses: actions/upload-artifact@v4
        with:
          name: scorm-12-package
          path: dist/curso-indicadores-SCORM12.zip
          if-no-files-found: error
